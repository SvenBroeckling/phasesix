{% load i18n %}
{% load rules_extras %}
<div class="d-flex align-items-center justify-content-between">
    <h2>{% trans "Abstract" %}</h2>
    {% if may_edit %}
        <a data-modal-title="{% trans 'Edit settings' %}"
           data-modal-size-class="modal-lg"
           data-modal-event-after="refresh-fragments"
           data-modal-url="{% url 'campaigns:xhr_campaign_settings' pk=object.id mode='game' %}"
           class="text-white">
            <i class="fas fa-pencil-alt"></i>
        </a>
    {% endif %}
</div>
<p>{{ object.abstract|phasesix_markup }}</p>
