{% load rules_extras thumbnail %}
<h2>{{ title }}</h2>
{% if image %}
  {% thumbnail image "512" as im %}
    <img class="character-creation-info-image" src="{{ im.url }}" alt="{{ title }}">
  {% endthumbnail %}
{% endif %}
{% if lineage %}
  <div class="character-creation-info-template">{% template_widget lineage.template %}</div>
{% endif %}
<div class="character-creation-info-copy">{{ description|phasesix_markup }}</div>
