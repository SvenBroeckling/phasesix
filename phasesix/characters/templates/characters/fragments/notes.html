{% load rules_extras %}
{% load characters_extras %}
{% load i18n %}
<div class="row">
  <div class="col-md-12">
    {% if may_edit %}
      <div class="row">
        <div class="col-12">
          <button class="btn btn-primary float-end mb-2"
                  data-sidebar-right-title="{% trans 'Take a note' %}"
                  data-sidebar-right-url="{% url 'characters:xhr_sidebar' pk=object.id sidebar_template="create_note" %}">{% trans "Take a note" %}</button>
        </div>
      </div>
    {% endif %}
    <div class="column-container">
      {% character_notes character user as notes %}
      {% for note in notes %}
        <div data-sidebar-right-title="{% trans 'Note' %}"
             data-sidebar-right-url="{% url 'characters:xhr_sidebar' pk=note.id sidebar_template="note" %}"
             class="card mb-3">
          <div class="card-header">
            {% if note.is_private %}
              <span class="float-end"><i class="fas fa-lock"></i></span>
            {% endif %}
            {{ note.subject|default:"Note" }}
          </div>
          <div class="card-body">
            {{ note.text|default:""|phasesix_markup }}
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
