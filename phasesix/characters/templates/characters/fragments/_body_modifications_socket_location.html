{% load i18n %}
<div class="card h-100">
  <div
    {% if may_edit %}
      data-modal-url="{% url 'characters:xhr_character_objects' pk=object.id object_type="body_modification" %}"
      data-modal-size-class="modal-xl"
      data-modal-event-after="refresh-character-body_modifications"
      data-modal-title="{% trans 'Add Body Modification' %}"
    {% endif %}
      class="card-body d-flex flex-column align-items-center">
        <span title="{% trans "Sockets" %}"
              class="position-absolute top-0 end-0 m-2 badge rounded-pill bg-dark d-flex align-items-center">
            <i class="gi gi-delapouite-plug"></i>&nbsp;{{ sockets }}
        </span>
    <i class="{{ icon_class }} fs-2"></i>
    {{ location_name }}
  </div>

  <ul class="list-group list-group-flush">
    {% for cbm in qs %}
      <li data-sidebar-right-title="{{ cbm.body_modification.name }}"
          data-sidebar-right-url="{% url 'characters:xhr_sidebar' pk=cbm.id sidebar_template="body_modification" %}"
          class="list-group-item d-flex justify-content-between align-items-center text-start">
        <div class="d-flex align-items-center">
          <i title="{% trans "Is active" %}"
             class="fs-5 gi {% if cbm.is_active %}gi-guard13007-play-button text-success{% else %}gi gi-lord-berandas-power-button text-danger{% endif %} me-2"></i>
          {{ cbm.body_modification.name }}
        </div>
        <span class="badge bg-dark rounded-pill">
            <i class="gi gi-delapouite-plug me-1"></i>
            {{ cbm.socket_amount }}
          </span>
      </li>
    {% empty %}
      <li class="list-group-item d-flex justify-content-between align-items-center text-start">
        <div class="d-flex align-items-center">
          {% trans "No modification yet" %}
        </div>
      </li>
    {% endfor %}
  </ul>
</div>
