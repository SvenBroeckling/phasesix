{% load i18n %}
{% if object.templates_with_rules.exists %}
  <table class="table">
    <thead>
    <tr>
      <th>{% trans 'Shadows' %}</th>
    </tr>
    </thead>
    {% for template in object.templates_with_rules.all %}
      <tr data-sidebar-right-title="{{ template.template.name }}"
          data-sidebar-right-url="{% url 'characters:xhr_sidebar' pk=template.template.id sidebar_template="template_shadow" %}">
        <td>{{ template.template.name }}</td>
      </tr>
    {% endfor %}
    {% for quirk in object.quirks.all %}
      <tr data-sidebar-right-title="{{ quirk }}"
          data-sidebar-right-url="{% url 'characters:xhr_sidebar' pk=object.id sidebar_template="horror" %}">
        <td>{{ quirk }} <small>({% trans 'Quirk' %})</small></td>
      </tr>
    {% endfor %}
  </table>
{% endif %}
