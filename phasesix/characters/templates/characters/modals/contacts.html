{% load i18n %}
{% load django_bootstrap5 %}

<form action="{% url "characters:xhr_contact" pk=object.id %}"
      class="add-form"
      method="post">
  {% csrf_token %}
  {% bootstrap_form form layout="floating" %}
  <button
    data-success="{% trans 'Created' %}"
    class="btn btn-primary">{% trans "Create" %}</button>
</form>
