{% load i18n %}
{% load django_bootstrap5 %}

<form action="{% url "characters:xhr_contact" pk=object.id %}"
      data-fetch-form="true"
      data-fetch-form-close="all"
      method="post">
  {% csrf_token %}
  {% bootstrap_form form layout="floating" %}
  <button class="btn btn-primary">{% trans "Create" %}</button>
</form>
