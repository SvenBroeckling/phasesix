{% load i18n %}
{% load django_bootstrap5 %}

<form class="add-form"
      action="{% url "characters:xhr_edit_description" pk=object.id %}">
  {% csrf_token %}
  {% bootstrap_form form show_label=False %}
  <button
    data-success="{% trans 'Saved' %}"
    class="btn btn-primary">{% trans "Save" %}</button>
</form>
