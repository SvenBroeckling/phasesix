{% load characters_extras %}
{% load i18n %}

<div class="card card-inlay">
  <h5 class="card-title">{% trans 'Skills' %}</h5>
  <table class="table table-underline">
    {% for skill in object.skills.practical_skills %}
      <tr>
        <td>
          {{ skill.skill }} <small class="text-muted">({{ skill.skill.reference_attribute_1.name }})</small>
        </td>
        <td class="text-end">{{ skill.value }}</td>
      </tr>
    {% endfor %}
  </table>
</div>
