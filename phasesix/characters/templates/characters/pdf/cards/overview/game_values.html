{% load i18n %}
<div class="card card-inlay mb-3">
  <h5 class="card-title">{% trans 'Game values' %}</h5>
  <table class="table table-underline table-condensed">
    <tr>
      <td>{% trans "Actions" %}</td>
      <td class="text-end">{{ object.actions }}</td>
    </tr>
    <tr>
      <td>{% trans "Evasion" %}</td>
      <td class="text-end">{{ object.evasion }}</td>
    </tr>
    <tr>
      <td>{% trans "Minimum Roll" %}</td>
      <td class="text-end">{{ object.minimum_roll }}</td>
    </tr>
    <tr>
      <td>{% trans "Concealment" %}</td>
      <td class="text-end">{{ object.max_concealment }}</td>
    </tr>
  </table>
</div>
