{% load characters_extras %}
<header>
  <span class="text-muted">{{ object.lineage }}</span><br>
  <span class="text-muted">{% template_category_string object 3 '' %}</span><br>
  <span class="text-muted">{% template_category_string object 2 '' %}</span>
</header>

{% if object.image %}
  <img src="{{ object.image.path }}" alt="{{ object }}" class="img-fluid">
{% endif %}
