{% load characters_extras %}
{% load i18n %}

<div class="box">
  <h2>{% trans 'Practical Skills' %}</h2>

  <table class="table">
    {% for skill in object.skills.practical_skills %}
      <tr>
        <td>
          {{ skill.skill }}
          <small class="text-muted">({{ skill.skill.reference_attribute_1.name }})</small>
        </td>
        <td class="text-end text-light">{{ skill.value }}</td>
      </tr>
    {% endfor %}
  </table>
</div>
