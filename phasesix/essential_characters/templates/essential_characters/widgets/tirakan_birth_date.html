<input type="{{ widget.type }}"
       name="{{ widget.name }}"
       {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}
       list="{{ widget.month_list_id }}"
       {% include "django/forms/widgets/attrs.html" %}>
<datalist id="{{ widget.month_list_id }}">
  {% for month_name in widget.month_names %}<option value="{{ month_name }}">{% endfor %}
</datalist>
