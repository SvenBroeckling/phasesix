{% load i18n %}
<div class="essential-readonly-rank-row">
  <div>
    <strong>{{ label }}</strong>
    {% if target %}<small>{% trans "Target" %} {{ target }}</small>{% endif %}
  </div>
  <div class="essential-readonly-ranks" aria-label="{{ label }}: {{ value }}">
    {% for option in options %}
      {% if condition_name and may_edit %}
        <button type="button"
                class="essential-rank-circle{% if option == value %} selected{% endif %}"
                data-essential-condition-url="{% url 'essential_characters:set_condition' slug=object.slug condition=condition_name %}"
                data-essential-condition-value="{{ option }}"
                aria-label="{{ label }}: {{ option }}">{{ option }}</button>
      {% else %}
        <span class="essential-rank-circle{% if option == value %} selected{% endif %}">{{ option }}</span>
      {% endif %}
    {% endfor %}
  </div>
</div>
