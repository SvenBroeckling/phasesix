{% extends "base.html" %}
{% load i18n %}
{% load django_bootstrap5 %}

{% block content %}
  <form action="{% url "gmtools:upload_rulebook" %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% bootstrap_form form layout="floating" %}
    <button class="btn btn-primary btn-lg">
      {% trans "Upload" %}
    </button>
  </form>
{% endblock %}
