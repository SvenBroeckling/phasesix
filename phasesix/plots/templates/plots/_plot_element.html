{% load i18n %}
{# Recursively renders a PlotElement and its children. Expects variables: element, depth #}
<div class="plot-element-container" data-element-id="{{ element.id }}"
     style="margin-left: {{ depth|default:0|add:0 }}rem;">
  <div class="plot-bar d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <button
        class="btn btn-sm btn-outline-light toggle-children"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#children-{{ element.id }}"
        aria-expanded="true"
        aria-controls="children-{{ element.id }}"
        title="{% trans 'Collapse/Expand' %}">
        <i class="fa fa-chevron-down"></i>
      </button>
      <span class="badge text-bg-secondary">{{ element.get_type_display }}</span>
      <span class="fw-semibold">{{ element.name }}</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button
        data-modal-url="{% url "plots:create_plot_element" plot_pk=object.id %}?parent_pk={{ element.id }}"
        data-modal-refresh-after="true"
        data-modal-title="{% trans 'Create plot element' %}"
        class="btn btn-sm btn-success" type="button" title="{% trans 'Create child element' %}"><i
        class="fa fa-plus"></i> {% trans 'Child' %}</button>
    </div>
  </div>
  <div id="children-{{ element.id }}" class="collapse show ms-0">
    <div class="sortable" data-parent-id="{{ element.id }}">
      {% for child in element.children.all %}
        {% include 'plots/_plot_element.html' with element=child depth=depth|add:2 %}
      {% endfor %}
    </div>
  </div>
</div>
