{% load i18n %}
<div class="sortable" data-parent-id="root">
  {% for element in object.root_elements %}
    {% include 'plots/_plot_element.html' with element=element depth=0 %}
  {% empty %}
    <div
      class="text-muted fst-italic">{% trans 'No plot elements yet. Use "Root element" to get started.' %}</div>
  {% endfor %}
</div>
