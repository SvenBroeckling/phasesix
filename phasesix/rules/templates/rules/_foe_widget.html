{% load i18n characters_extras rules_extras %}
<div class="card mb-3">
  <img src="{{ foe.image.url }}" alt="{{ foe.name }}" class="card-img-top">
  <div class="card-body position-relative">
    <h4>{{ foe }}</h4>

    {% if character and add_button %}
      <form action="{% url 'characters:xhr_character_objects' pk=character.id object_type="foe" %}"
            class="float-end add-form" method="post">
        {% csrf_token %}
        <input type="hidden" name="object_id" value="{{ foe.id }}">
        <button class="btn btn-sm btn-primary m-2"
                data-danger="{% trans 'Not possible' %}"
                data-success="{% trans 'Added' %}">
          {% trans 'Add' %}
        </button>
      </form>
    {% endif %}

    {% if user.is_superuser %}
      <a href="{% url 'admin:rules_foe_change' foe.id %}"
         style="position: absolute; bottom: 2px; right: 2px; font-size: xx-small">admin</a>
    {% endif %}
  </div>
</div>
